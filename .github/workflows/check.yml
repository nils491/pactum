name: Prüfung
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Syntax, Fragenkatalog, Jugendschutz, Schlüssel
        run: npm run check
      - name: Build (Platzhalter in Rechtstexten erlaubt)
        run: npm run build
        env:
          ALLOW_PLACEHOLDERS: '1'
